<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aligned Sound Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&display=swap');
        
        body {
            font-family: 'Playfair Display', serif;
            background-color: #1a0f08;
            margin: 0;
            color: #d4c3b5;
        }

        .font-sans { font-family: 'Inter', sans-serif; }

        .m3-expressive-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 16px; 
            background: #2a1a10; 
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            overflow: hidden; 
            border: 1px solid rgba(139, 94, 52, 0.1);
        }

        .m3-expressive-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 4px; 
            height: 16px;
            background: #d4c3b5;
            cursor: pointer;
            box-shadow: -407px 0 0 400px #8b5e34;
            transition: background 0.2s ease;
        }

        .m3-expressive-slider::-moz-range-thumb {
            width: 4px;
            height: 16px;
            background: #d4c3b5;
            cursor: pointer;
            border: none;
            box-shadow: -407px 0 0 400px #8b5e34;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes gridSlideIn {
            from { transform: translateX(40px); opacity: 0; filter: blur(10px); }
            to { transform: translateX(0); opacity: 1; filter: blur(0); }
        }
        .animate-grid-switch { animation: gridSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        @keyframes pulse-soft {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .animate-pulse-soft { animation: pulse-soft 3s ease-in-out infinite; }

        /* Node Pulse Animation */
        @keyframes node-pulse {
            0%, 100% { transform: scale(0.94); filter: brightness(0.9); }
            50% { transform: scale(0.98); filter: brightness(1.2); }
        }
        .animate-node-active {
            animation: node-pulse var(--pulse-duration, 3s) ease-in-out infinite;
            animation-delay: var(--global-sync-delay, 0s);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const MenuIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b5e34" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        );

        const PlayIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#8b5e34" stroke="#8b5e34" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        );

        const Volume2Icon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c4a3c" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        );

        const VolumeXIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c4a3c" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        );

        const CATEGORIES = ['EARTH', 'WATER', 'AIR', 'FIRE', 'ETHER', 'SPIRIT'];
        const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const MAJOR_SCALE_STEPS = [0, 2, 4, 5, 7, 9, 11, 12, 14];

        const ETHER_SAMPLE_URLS = [
            "https://assets.mixkit.co/active_storage/sfx/1070/1070-preview.mp3",
            "https://dl.dropboxusercontent.com/scl/fi/hv95wseyar4or1pmp9nsi/barnswallow-clicks.mp3?rlkey=hsskdvhqvhewjlrin6egf4z0r&st=r1kc8fv5&dl=1",
            "https://cdn.pixabay.com/audio/2022/05/27/audio_1808d7a484.mp3",
            "https://cdn.pixabay.com/audio/2022/03/15/audio_735c026857.mp3", 
            "https://cdn.pixabay.com/audio/2021/08/09/audio_8238101413.mp3", 
            "https://cdn.pixabay.com/audio/2022/05/27/audio_1808d7a484.mp3",
            "https://cdn.pixabay.com/audio/2022/03/15/audio_735c026857.mp3",
            "https://cdn.pixabay.com/audio/2021/08/09/audio_8238101413.mp3",
            "https://cdn.pixabay.com/audio/2022/05/27/audio_1808d7a484.mp3"
        ];

        const CATEGORY_OFFSETS = {
            'EARTH': -12, 'WATER': 0, 'AIR': 12, 'FIRE': 7, 'ETHER': 19, 'SPIRIT': -24
        };

        const CATEGORY_TAB_STYLES = {
            'EARTH': 'bg-[#3d2a1d] border-[#8b5e34] text-[#8b5e34]',
            'WATER': 'bg-blue-900/20 border-blue-500 text-blue-400',
            'AIR': 'bg-white/10 border-white text-white',
            'FIRE': 'bg-red-900/20 border-red-600 text-red-500',
            'ETHER': 'bg-white/10 border-white text-white',
            'SPIRIT': 'bg-white/10 border-white text-white'
        };

        const CATEGORY_GRID_STYLES = {
            'EARTH': 'from-[#d97706] to-[#78350f] shadow-[0_0_40px_rgba(217,119,6,0.4)]',
            'WATER': 'from-blue-400 to-blue-900 shadow-[0_0_40px_rgba(59,130,246,0.4)]',
            'AIR': 'from-white/40 to-slate-400 shadow-[0_0_40px_rgba(255,255,255,0.2)]',
            'FIRE': 'from-red-400 to-red-900 shadow-[0_0_40px_rgba(239,68,68,0.4)]',
            'ETHER': 'from-white/20 to-slate-200 shadow-[0_0_40px_rgba(255,255,255,0.1)]',
            'SPIRIT': 'from-white/40 to-slate-400 shadow-[0_0_40px_rgba(255,255,255,0.2)]'
        };

        function App() {
            const [rootKey, setRootKey] = useState("C#");
            const [currentCategory, setCurrentCategory] = useState('EARTH');
            const [bpm, setBpm] = useState(99);
            const [tuning, setTuning] = useState(432);
            const [volume, setVolume] = useState(0.5);
            const [isMuted, setIsMuted] = useState(false);
            const [isDropdownOpen, setIsDropdownOpen] = useState(null);
            const [isAudioStarted, setIsAudioStarted] = useState(false);
            const [loadingSamples, setLoadingSamples] = useState(false);

            const [grids, setGrids] = useState(() => {
                const initial = {};
                CATEGORIES.forEach(cat => initial[cat] = new Array(9).fill(false));
                return initial;
            });

            const audioCtx = useRef(null);
            const masterGain = useRef(null);
            const oscillators = useRef({});
            const noiseBuffer = useRef(null);
            const etherBuffers = useRef([]);
            
            const waterLFO = useRef(null);
            const airLFO = useRef(null);
            const sessionStartTime = useRef(null);

            const pulseDuration = useMemo(() => {
                if (currentCategory === 'WATER') return `${240 / bpm}s`; 
                if (currentCategory === 'AIR') return `${60 / bpm}s`;   
                return '3s'; 
            }, [currentCategory, bpm]);

            const initAudio = async (e) => {
                if (e) e.preventDefault();
                setLoadingSamples(true);
                try {
                    if (!audioCtx.current) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        audioCtx.current = new AudioContext();
                        masterGain.current = audioCtx.current.createGain();
                        masterGain.current.connect(audioCtx.current.destination);

                        sessionStartTime.current = performance.now();
                        document.documentElement.style.setProperty('--global-sync-delay', `-${sessionStartTime.current / 1000}s`);

                        const bufferSize = audioCtx.current.sampleRate * 2;
                        noiseBuffer.current = audioCtx.current.createBuffer(1, bufferSize, audioCtx.current.sampleRate);
                        const output = noiseBuffer.current.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                        waterLFO.current = audioCtx.current.createOscillator();
                        waterLFO.current.frequency.setValueAtTime(bpm / 240, audioCtx.current.currentTime);
                        waterLFO.current.start();

                        airLFO.current = audioCtx.current.createOscillator();
                        airLFO.current.type = 'triangle';
                        airLFO.current.frequency.setValueAtTime(bpm / 60, audioCtx.current.currentTime);
                        airLFO.current.start();
                    }
                    if (audioCtx.current.state === 'suspended') await audioCtx.current.resume();

                    if (etherBuffers.current.length === 0) {
                        const loadPromises = ETHER_SAMPLE_URLS.map(async (url, idx) => {
                            try {
                                let resp = await fetch(url);
                                if (!resp.ok && url.includes('dropbox')) {
                                    resp = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
                                }
                                if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
                                const arrayBuf = await resp.arrayBuffer();
                                return await audioCtx.current.decodeAudioData(arrayBuf);
                            } catch (error) {
                                console.warn(`Failed to load Ether sample ${idx}:`, error);
                                return null;
                            }
                        });
                        etherBuffers.current = await Promise.all(loadPromises);
                    }
                    
                    setIsAudioStarted(true);
                } catch (err) {
                    console.error("Audio Load Error:", err);
                } finally {
                    setLoadingSamples(false);
                }
            };

            useEffect(() => {
                if (masterGain.current && audioCtx.current) {
                    masterGain.current.gain.setTargetAtTime(isMuted ? 0 : volume, audioCtx.current.currentTime, 0.05);
                }
            }, [volume, isMuted]);

            const getFrequency = (category, padIndex) => {
                const rootIndex = NOTES.indexOf(rootKey);
                const offset = CATEGORY_OFFSETS[category] || 0;
                const semitonesFromA4 = (rootIndex + MAJOR_SCALE_STEPS[padIndex] + offset) - 9;
                return tuning * Math.pow(2, semitonesFromA4 / 12);
            };

            const togglePad = async (index) => {
                if (audioCtx.current?.state === 'suspended') await audioCtx.current.resume();

                const currentPads = [...grids[currentCategory]];
                const isActivating = !currentPads[index];
                currentPads[index] = isActivating;

                setGrids(prev => ({ ...prev, [currentCategory]: currentPads }));

                if (isActivating) playTone(currentCategory, index); 
                else stopTone(currentCategory, index);
            };

            const playTone = (cat, index) => {
                if (!audioCtx.current || audioCtx.current.state !== 'running') return;
                
                const id = `${cat}-${index}`;
                const env = audioCtx.current.createGain();
                const segmentPeak = cat === 'FIRE' ? 0.05 : 0.2; 
                
                const attackTC = cat === 'FIRE' ? 0.01 : 0.6;
                env.gain.setValueAtTime(0, audioCtx.current.currentTime);
                env.gain.setTargetAtTime(segmentPeak, audioCtx.current.currentTime, attackTC); 

                let sourceNode = null;
                let auxSources = []; 
                let lfoGNodes = []; 
                let filterNode = null;

                if (cat === 'ETHER' && etherBuffers.current[index]) {
                    sourceNode = audioCtx.current.createBufferSource();
                    sourceNode.buffer = etherBuffers.current[index];
                    sourceNode.loop = true;
                    const rootIndex = NOTES.indexOf(rootKey);
                    const rate = index < 2 ? 1.0 : Math.pow(2, (rootIndex - 1) / 24); 
                    sourceNode.playbackRate.setValueAtTime(rate, audioCtx.current.currentTime);
                    sourceNode.connect(env);
                    env.connect(masterGain.current);
                    sourceNode.start(0);
                } else {
                    const osc = audioCtx.current.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(getFrequency(cat, index), audioCtx.current.currentTime);
                    sourceNode = osc;

                    if (cat === 'WATER' && waterLFO.current) {
                        const lfoG = audioCtx.current.createGain(); 
                        lfoG.gain.setValueAtTime(0.08, audioCtx.current.currentTime);
                        const filter = audioCtx.current.createBiquadFilter(); 
                        filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, audioCtx.current.currentTime);
                        waterLFO.current.connect(lfoG); 
                        lfoG.connect(env.gain); 
                        osc.connect(env); 
                        env.connect(filter); 
                        filter.connect(masterGain.current);
                        lfoGNodes.push(lfoG);
                        filterNode = filter;
                        osc.start();
                    } else if (cat === 'AIR' && airLFO.current) {
                        const lfoG = audioCtx.current.createGain(); 
                        lfoG.gain.setValueAtTime(0.1, audioCtx.current.currentTime);
                        const filter = audioCtx.current.createBiquadFilter(); 
                        filter.type = 'highpass'; filter.frequency.setValueAtTime(1200, audioCtx.current.currentTime);
                        airLFO.current.connect(lfoG); 
                        lfoG.connect(env.gain); 
                        osc.connect(env); 
                        env.connect(filter); 
                        filter.connect(masterGain.current);
                        lfoGNodes.push(lfoG);
                        filterNode = filter;
                        osc.start();
                    } else if (cat === 'FIRE') {
                        const fireBus = audioCtx.current.createGain();
                        fireBus.connect(env);

                        const activeObj = { node: null, env, auxSources, lfoGNodes, filterNode, fireTimers: [] };
                        oscillators.current[id] = activeObj;

                        const triggerBillow = () => {
                            if (!oscillators.current[id]) return;
                            const now = audioCtx.current.currentTime;
                            const bOsc = audioCtx.current.createBufferSource();
                            bOsc.buffer = noiseBuffer.current;
                            const bFilt = audioCtx.current.createBiquadFilter();
                            bFilt.type = 'lowpass'; bFilt.frequency.setValueAtTime(50, now);
                            const bG = audioCtx.current.createGain();
                            const intensity = 1.0 + Math.random(); 
                            bG.gain.setValueAtTime(0, now);
                            bG.gain.setTargetAtTime(intensity, now, 0.15);
                            bG.gain.setTargetAtTime(0, now + 0.2, 0.4);
                            bOsc.connect(bFilt); bFilt.connect(bG); bG.connect(fireBus);
                            bOsc.start(now); bOsc.stop(now + 2.0);
                            activeObj.fireTimers.push(setTimeout(triggerBillow, 500 + Math.random() * 1500));
                        };
                        triggerBillow();

                        const triggerCrack = () => {
                            if (!oscillators.current[id]) return;
                            const now = audioCtx.current.currentTime;
                            const cOsc = audioCtx.current.createBufferSource();
                            cOsc.buffer = noiseBuffer.current;
                            const cFilt = audioCtx.current.createBiquadFilter();
                            const isSnap = Math.random() > 0.5;
                            cFilt.type = 'bandpass';
                            cFilt.frequency.setValueAtTime(isSnap ? 4500 : 700, now);
                            cFilt.Q.setValueAtTime(isSnap ? 15 : 5, now);
                            const cG = audioCtx.current.createGain();
                            const vol = isSnap ? (3.5 + Math.random() * 2) : (2.0 + Math.random());
                            cG.gain.setValueAtTime(vol, now);
                            cG.gain.exponentialRampToValueAtTime(0.001, now + (isSnap ? 0.008 : 0.025));
                            cOsc.connect(cFilt); cFilt.connect(cG); cG.connect(fireBus);
                            cOsc.start(now); cOsc.stop(now + 0.2);
                            activeObj.fireTimers.push(setTimeout(triggerCrack, 100 + Math.random() * 4000));
                        };
                        triggerCrack();

                        env.connect(masterGain.current);
                    } else {
                        osc.connect(env); 
                        env.connect(masterGain.current);
                        osc.start();
                    }
                }
                
                if (!oscillators.current[id]) {
                    oscillators.current[id] = { node: sourceNode, env, auxSources, lfoGNodes, filterNode };
                }
            };

            const stopTone = (cat, index) => {
                const id = `${cat}-${index}`;
                const active = oscillators.current[id];
                if (active) {
                    const { node, env, auxSources, lfoGNodes, filterNode, fireTimers } = active;
                    const now = audioCtx.current.currentTime;
                    
                    if (lfoGNodes) {
                        lfoGNodes.forEach(g => {
                            g.gain.cancelScheduledValues(now);
                            g.gain.setValueAtTime(g.gain.value, now);
                            g.gain.setTargetAtTime(0, now, 0.4); 
                        });
                    }

                    env.gain.cancelScheduledValues(now);
                    env.gain.setValueAtTime(env.gain.value, now);
                    env.gain.setTargetAtTime(0, now, 0.8); 
                    
                    if (node && node.stop) try { node.stop(now + 4.0); } catch(e) {}
                    if (auxSources) auxSources.forEach(s => { try { s.stop(now + 4.0); } catch(e) {} });
                    
                    setTimeout(() => {
                        try {
                            if (filterNode) filterNode.disconnect();
                            if (lfoGNodes) lfoGNodes.forEach(g => g.disconnect());
                        } catch(e) {}
                    }, 4500);

                    if (fireTimers) fireTimers.forEach(t => clearTimeout(t));
                    delete oscillators.current[id];
                }
            };

            useEffect(() => {
                if (waterLFO.current && audioCtx.current) {
                    waterLFO.current.frequency.setTargetAtTime(bpm / 240, audioCtx.current.currentTime, 0.5);
                }
                if (airLFO.current && audioCtx.current) {
                    airLFO.current.frequency.setTargetAtTime(bpm / 60, audioCtx.current.currentTime, 0.5);
                }
            }, [bpm]);

            useEffect(() => {
                Object.keys(oscillators.current).forEach(id => {
                    const [cat, idxStr] = id.split('-');
                    const idx = parseInt(idxStr);
                    const active = oscillators.current[id];
                    if (active && audioCtx.current) {
                        if (active.node && active.node.frequency) {
                            active.node.frequency.setTargetAtTime(getFrequency(cat, idx), audioCtx.current.currentTime, 0.1);
                        }
                        if (active.node && active.node.playbackRate) {
                            const rootIndex = NOTES.indexOf(rootKey);
                            const rate = (idx < 2 && cat === 'ETHER') ? 1.0 : Math.pow(2, (rootIndex - 1) / 24);
                            active.node.playbackRate.setTargetAtTime(rate, audioCtx.current.currentTime, 0.1);
                        }
                    }
                });
            }, [rootKey, tuning]);

            return (
                <div className="min-h-screen bg-[#1a0f08] flex flex-col font-serif select-none overflow-y-auto overflow-x-hidden touch-pan-y pb-10">
                    
                    {!isAudioStarted && (
                        <div className="fixed inset-0 z-[100] bg-[#1a0f08] flex flex-col items-center justify-center p-8 text-center backdrop-blur-md">
                            <div className="bg-[#2a1a10] p-10 rounded-[3.5rem] shadow-2xl border border-[#3d2a1d] flex flex-col items-center max-w-xs w-full animate-in fade-in zoom-in duration-500">
                                <div className="w-20 h-20 bg-[#8b5e34]/20 rounded-full flex items-center justify-center mb-6">
                                    <PlayIcon />
                                </div>
                                <h1 className="text-3xl mb-2 font-light text-[#d4c3b5]">1-Dream</h1>
                                <p className="text-sm text-[#5c4a3c] mb-6 font-sans leading-relaxed text-center">
                                    {loadingSamples ? "Downloading celestial samples..." : "Initialize the holistic sound engine."}
                                </p>
                                <button onClick={initAudio} disabled={loadingSamples} className="w-full py-5 bg-[#8b5e34] text-white rounded-2xl font-sans font-bold tracking-[0.2em] shadow-lg active:scale-95 transition-all">
                                    {loadingSamples ? "LOADING..." : "START SESSION"}
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="w-full flex flex-col items-center mt-10 px-6">
                        <div className="bg-[#2a1a10] p-4 rounded-2xl mb-2 shadow-lg active:bg-[#352216] transition-colors cursor-pointer">
                            <MenuIcon />
                        </div>
                        <span className="text-[10px] tracking-[0.3em] font-sans text-[#5c4a3c] font-bold uppercase">Alpha v0.2</span>
                    </div>

                    <div className="grid grid-cols-3 gap-4 w-full max-w-md mx-auto mt-10 px-6 text-[#d4c3b5]">
                        <div className="relative flex flex-col items-center">
                            <button 
                                onClick={() => setIsDropdownOpen(isDropdownOpen === 'key' ? null : 'key')} 
                                className="w-full border border-[#3d2a1d] py-6 px-2 rounded-[2.5rem] active:bg-[#3d2a1d] transition-all flex flex-col items-center group"
                            >
                                <span className="text-4xl font-light mb-1 group-hover:text-white transition-colors">{rootKey}</span>
                                <span className="text-[10px] tracking-widest text-[#5c4a3c] font-sans uppercase font-bold">Key</span>
                            </button>
                            {isDropdownOpen === 'key' && (
                                <div className="absolute top-full mt-2 bg-[#2a1a10] border border-[#3d2a1d] rounded-xl grid grid-cols-3 gap-1 p-2 z-50 shadow-2xl custom-scrollbar max-h-64 overflow-y-auto animate-in fade-in zoom-in duration-200">
                                    {NOTES.map(k => <div key={k} onClick={() => {setRootKey(k); setIsDropdownOpen(null);}} className={`px-3 py-2 rounded text-center text-sm ${rootKey === k ? 'bg-[#8b5e34] text-white' : 'hover:bg-[#352216]'}`}>{k}</div>)}
                                </div>
                            )}
                        </div>

                        <div className="relative flex flex-col items-center">
                            <button 
                                onClick={() => setIsDropdownOpen(isDropdownOpen === 'bpm' ? null : 'bpm')} 
                                className="w-full border border-[#3d2a1d] py-6 px-2 rounded-[2.5rem] active:bg-[#3d2a1d] transition-all flex flex-col items-center group"
                            >
                                <span className="text-4xl font-light mb-1 group-hover:text-white transition-colors">{bpm}</span>
                                <span className="text-[10px] tracking-widest text-[#5c4a3c] font-sans uppercase font-bold">BPM</span>
                            </button>
                            {isDropdownOpen === 'bpm' && (
                                <div className="absolute top-full mt-2 bg-[#2a1a10] border border-[#3d2a1d] rounded-xl h-48 overflow-y-auto w-24 z-50 shadow-2xl custom-scrollbar animate-in fade-in zoom-in duration-200">
                                    {Array.from({length: 81}, (_, i) => i + 40).map(b => (
                                        <div key={b} onClick={() => { setBpm(b); setIsDropdownOpen(null); }}
                                            className={`px-3 py-2 text-center text-sm ${bpm === b ? 'bg-[#8b5e34] text-white' : 'hover:bg-[#352216]'}`}>
                                            {b}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="flex flex-col items-center">
                            <button 
                                onClick={() => setTuning(tuning === 432 ? 440 : 432)} 
                                className="w-full border border-[#3d2a1d] py-6 px-2 rounded-[2.5rem] active:bg-[#3d2a1d] transition-all flex flex-col items-center group"
                            >
                                <span className="text-4xl font-light mb-1 group-hover:text-white transition-colors">{tuning}</span>
                                <span className="text-[10px] tracking-widest text-[#5c4a3c] font-sans uppercase font-bold">Hz</span>
                            </button>
                        </div>
                    </div>

                    <div className="w-full mt-10 overflow-x-auto no-scrollbar scroll-smooth">
                        <div className="flex space-x-4 px-8 min-w-max justify-center">
                            {CATEGORIES.map((cat) => (
                                <button 
                                    key={cat} onClick={() => setCurrentCategory(cat)}
                                    className={`px-6 py-2 rounded-full text-[10px] font-sans font-bold tracking-widest border transition-all duration-300 ${cat === currentCategory ? CATEGORY_TAB_STYLES[cat] : 'border-[#3d2a1d] text-[#5c4a3c] opacity-50'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div key={currentCategory} className="grid grid-cols-3 gap-4 w-full max-w-md mx-auto aspect-square mt-10 px-8 animate-grid-switch">
                        {grids[currentCategory].map((isActive, i) => (
                            <button 
                                key={`${currentCategory}-${i}`} onPointerDown={(e) => { e.preventDefault(); togglePad(i); }}
                                style={{ "--pulse-duration": pulseDuration }}
                                className={`relative rounded-[2.5rem] transition-all duration-300 overflow-hidden active:scale-90 touch-manipulation ${isActive ? `bg-gradient-to-br ${CATEGORY_GRID_STYLES[currentCategory]} animate-node-active` : 'bg-[#2a1a10]'}`}
                            >
                                <div className={`absolute inset-0 transition-opacity duration-700 ${isActive ? 'opacity-100' : 'opacity-0'}`}>
                                    <div className="absolute inset-[15%] rounded-[1.8rem] bg-black/40 blur-xl" />
                                </div>
                                <div className={`absolute inset-0 border-[1px] rounded-[2.5rem] transition-colors duration-500 ${isActive ? 'border-white/20' : 'border-white/5'}`} />
                            </button>
                        ))}
                    </div>

                    <div className="w-full max-w-md mx-auto flex items-center space-x-6 px-10 mt-12 mb-12">
                        <button onClick={() => setIsMuted(!isMuted)} className="p-2 active:opacity-50 transition-opacity">
                            {isMuted || volume === 0 ? <VolumeXIcon /> : <Volume2Icon />}
                        </button>
                        <div className="flex-1 relative h-12 flex items-center">
                            <input type="range" min="0" max="1" step="0.01" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="m3-expressive-slider" />
                            <div className="absolute left-0 w-1.5 h-1.5 rounded-full bg-[#1a0f08] translate-x-1.5 pointer-events-none" />
                        </div>
                    </div>

                    <div className="mt-auto pb-8 opacity-20 text-[8px] tracking-[0.4em] font-sans font-bold text-center uppercase">Aligned Sound Engine, 1-DREAM</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
